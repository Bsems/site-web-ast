name: Diagnostiquer l'accès FFBB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ffbb.in
      - run: python -m pip install -r requirements-ffbb.in
      - run: python scripts/diagnose_ffbb.py
