# Actualiser les données du dépôt ; ce workflow ne déploie pas le site web.
name: Actualiser les données FFBB
on:
  workflow_dispatch:
  schedule:
    # Horaires UTC, indépendants des changements d'heure français.
    - cron: '0 7,19 * * *'
permissions:
  contents: write
# Sérialiser les imports pour éviter deux écritures simultanées par ce workflow.
concurrency:
  group: update-ffbb
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ffbb.in
      - run: python -m pip install -r requirements-ffbb.in
      # Tester l'adaptateur sans réseau, puis contrôler l'instantané réellement importé.
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: node scripts/update-calendar.mjs
      - run: node --test scripts/calendar.test.mjs scripts/permanences.test.mjs
      # Versionner seulement les sorties générées ; un push refusé n'est jamais forcé.
      - name: Enregistrer les données actualisées
        run: |
          git add data/calendar.json data/calendar-data.js data/equipes-data.js equipes.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Actualiser les rencontres et résultats FFBB"
          git push
